# EKS Bootcamp Web - Helm values

replicaCount: 3

image:
  repository: 222104430672.dkr.ecr.eu-west-1.amazonaws.com/eks-bootcamp-web
  tag: "v3"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 80

config:
  appEnv: "production"
  welcomeMessage: "Welkom bij de EKS Bootcamp"

resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "128Mi"
    cpu: "100m"

readinessProbe:
  path: /
  port: 80
  initialDelaySeconds: 5
  periodSeconds: 10

livenessProbe:
  path: /
  port: 80
  initialDelaySeconds: 15
  periodSeconds: 20