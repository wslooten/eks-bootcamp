apiVersion: apps/v1
kind: Deployment
metadata:
  name: eks-bootcamp-web
  annotations:
    kubernetes.io/change-cause: "Deploy versie 3"

spec:
  replicas: 3
  selector:
    matchLabels:
      app: eks-bootcamp-web
  template:
    metadata:
      labels:
        app: eks-bootcamp-web
    spec:
      containers:
        - name: eks-bootcamp-web
          image: 222104430672.dkr.ecr.eu-west-1.amazonaws.com/eks-bootcamp-web:v3
          
          envFrom:
            - configMapRef:
                name: eks-bootcamp-config
            - secretRef:
                name: eks-bootcamp-secret

          ports:
            - containerPort: 80

          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20